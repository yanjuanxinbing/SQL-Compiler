# ============================================================
# SQL-Compiler CI
#
#   1) 编译 C++ 引擎（Linux / Windows 双平台）
#   2) 跑 SQL 回归套件：逐字节比对 tests/expected/*.out
#   3) 跑 webui 可视化模块的 unittest 套件
#
# 为什么跑两个平台：项目主体是 C++17 + CMake，Windows 侧走 MSVC
# （CMakeLists 里有 /utf-8 这类 MSVC 专属选项），Linux 侧走 libstdc++。
# 两边的编译器差异、std::regex 报错文案差异都可能被回归套件抓到。
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发，方便本地怀疑 CI 挂掉时重跑
  workflow_dispatch:

# 只读权限：CI 只需要 clone 和跑测试，不需要写回仓库
permissions:
  contents: read

# 同一个分支上连着推多次时，取消还没跑完的旧任务，避免浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # 任一平台失败都要继续跑另一个平台，这样一次就能看到两个平台的结果
      fail-fast: false
      matrix:
        include:
          # Linux：CMake 默认生成器是 Unix Makefiles（单配置），
          # 可执行文件落在 build/sqlcompiler
          - os: ubuntu-latest
            bin: build/sqlcompiler
# ============================================================
# SQL-Compiler CI
#
#   1) 编译 C++ 引擎（Linux / Windows 双平台）
#   2) 跑 SQL 回归套件：逐字节比对 tests/expected/*.out
#   3) 跑 webui 可视化模块的 unittest 套件
#
# 为什么跑两个平台：项目主体是 C++17 + CMake，Windows 侧走 MSVC
# （CMakeLists 里有 /utf-8 这类 MSVC 专属选项），Linux 侧走 libstdc++。
# 两边的编译器差异、std::regex 报错文案差异都可能被回归套件抓到。
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发，方便本地怀疑 CI 挂掉时重跑
  workflow_dispatch:

# 只读权限：CI 只需要 clone 和跑测试，不需要写回仓库
permissions:
  contents: read

# 同一个分支上连着推多次时，取消还没跑完的旧任务，避免浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # 任一平台失败都要继续跑另一个平台，这样一次就能看到两个平台的结果
      fail-fast: false
      matrix:
        include:
          # Linux：CMake 默认生成器是 Unix Makefiles（单配置），
          # 可执行文件落在 build/sqlcompiler
          - os: ubuntu-latest
            bin: build/sqlcompiler
          # Windows：默认生成器是 Visual Studio 17 2022（多配置），
          # --config Release 对应 build/Release/sqlcompiler.exe
          - os: windows-latest
            bin: build/Release/sqlcompiler.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 固定版本，避免 runner 镜像升级导致结果漂移
          python-version: '3.12'

      - name: Configure CMake
        run: |
          cmake --version
          # 单配置生成器（Linux）用 CMAKE_BUILD_TYPE；
          # 多配置生成器（Windows）忽略它，靠下面 --config Release 选配置。
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        run: cmake --build build --config Release

      - name: SQL regression suite
        # 84+ 个用例，逐字节比对 stdout 与 tests/expected/*.out。
        # --bin 显式指定路径，不依赖各平台的默认查找规则。
        run: python tests/verify_outputs.py --bin "${{ matrix.bin }}"

      - name: Install webui dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r webui/requirements.txt

      - name: WebUI test suite
        working-directory: webui
        env:
          # 让测试直接找到刚编出来的引擎：engine.py 的查找顺序是
          # SQLCOMPILER_BIN → build/{Debug,Release,}/ → PATH
          SQLCOMPILER_BIN: ${{ github.workspace }}/${{ matrix.bin }}
        # -s backend/tests 扫测试目录，-t . 把顶层包目录设为 webui/，
        # 这样测试里的 `from backend.engine import ...` 才能解析到。
        run: python -m unittest discover -s backend/tests -t . -v
